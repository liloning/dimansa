<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디만사 포레스트 전용 미니 이모티콘 분할기 by. 릴로</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
  :root {
    --accent: #DB9A36;
    --bg: #FFFBF3;
    --border: #E5D9C8;
    --text: #3A2E1E;
    --sub: #9A8878;
    --panel-bg: #FFFFFF;
    --checker-a: #CCCCCC;
    --checker-b: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .top-section { padding: 14px 20px 0 20px; flex-shrink: 0; }
  .site-title { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.2; }
  .site-desc { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .guide-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .guide-label { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .guide-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: #fff; border: 1.5px solid var(--border); border-radius: 20px;
    padding: 5px 14px; font-size: 12px; color: var(--text);
    cursor: pointer; transition: border-color 0.15s, color 0.15s; font-weight: 500;
  }
  .guide-btn:hover { border-color: var(--accent); color: var(--accent); }

  .control-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; flex-shrink: 0; flex-wrap: wrap;
  }
  .upload-zone {
    display: inline-flex; align-items: center; gap: 8px;
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 8px 16px; cursor: pointer; transition: border-color 0.15s;
  }
  .upload-zone:hover { border-color: var(--accent); }
  .upload-zone.dragover { border-color: var(--accent); background: rgba(219,154,54,0.05); }
  .uz-icon { font-size: 20px; }
  .uz-text strong { font-size: 13px; font-weight: 700; display: block; }
  .uz-text span { font-size: 11px; color: var(--sub); }
  #fileInput { display: none; }

  .btn { border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; white-space: nowrap; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn-dark { background: #6B5B45; color: #fff; }
  .btn-dark:not(:disabled):hover { background: #574a39; }
  .btn-light { background: #F0E9DF; color: var(--text); }
  .btn-light:not(:disabled):hover { background: #e5dbd0; }
  .btn-orange { background: var(--accent); color: #fff; }
  .btn-orange:not(:disabled):hover { opacity: 0.85; }
  .btn-reset { margin-left: auto; background: transparent; color: var(--sub); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
  .bg-label { font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; }
  .bg-swatches { display: flex; gap: 5px; align-items: center; }
  .bg-swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #ddd;
    cursor: pointer; transition: border-color 0.15s, transform 0.15s; flex-shrink: 0;
  }
  .bg-swatch:first-child {
    background-image: linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size: 7px 7px; background-position: 0 0,0 3.5px,3.5px -3.5px,-3.5px 0px; background-color: #fff;
  }
  .bg-swatch.active { border-color: var(--accent); transform: scale(1.25); }

  .output-area { flex: 1; display: grid; grid-template-columns: 370px 1fr; padding: 0 20px 12px 20px; overflow: hidden; gap: 12px; }

  .preview-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-header-title { font-size: 12px; font-weight: 700; color: var(--sub); }
  .panel-header-info { font-size: 11px; color: var(--sub); }
  .preview-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .preview-body.checker {
    background-image: linear-gradient(45deg,var(--checker-a) 25%,transparent 25%),linear-gradient(-45deg,var(--checker-a) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--checker-a) 75%),linear-gradient(-45deg,transparent 75%,var(--checker-a) 75%);
    background-size: 16px 16px; background-position: 0 0,0 8px,8px -8px,-8px 0px; background-color: var(--checker-b);
  }
  #previewImg { max-width: 100%; max-height: 100%; object-fit: contain; display: none; padding: 8px; }
  .preview-placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    color: #5A4A38; font-size: 13px; text-align: center;
    padding: 28px 24px; background: rgba(255,255,255,0.82); border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .preview-placeholder .scissors { font-size: 36px; opacity: 0.7; }
  .preview-placeholder strong { color: #3A2E1E; font-weight: 700; }

  .grid-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .grid-header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .grid-header-title { font-size: 12px; font-weight: 700; color: var(--sub); }
  .grid-badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
  .grid-header-hint { margin-left: auto; font-size: 11px; color: var(--sub); }
  .grid-scroll { flex: 1; overflow-y: auto; padding: 10px; }
  .grid-inner { display: grid; grid-template-columns: repeat(6, 110px); gap: 6px; }
  .grid-cell {
    width: 110px; height: 110px; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
    position: relative; background: #fafafa;
  }
  .grid-cell.checker-cell {
    background-image: linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size: 8px 8px; background-position: 0 0,0 4px,4px -4px,-4px 0px; background-color: #fff;
  }
  .grid-cell:hover { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(219,154,54,0.2); }
  .grid-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(219,154,54,0.4); }
  .grid-cell img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cell-num { position: absolute; bottom: 2px; right: 4px; font-size: 9px; color: var(--sub); opacity: 0.5; }
  .empty-hint { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; color: var(--sub); font-size: 13px; text-align: center; }
  .status-bar { font-size: 11px; color: var(--sub); padding: 5px 14px; border-top: 1px solid var(--border); background: #FAFAF8; flex-shrink: 0; }
  .warn-bar { background: #FFF8E0; border-bottom: 1px solid #FFE58F; padding: 6px 14px; font-size: 12px; color: #8A6500; flex-shrink: 0; display: none; }
</style>
</head>
<body>

    <div class="top-section">
  <div class="site-title">디만사 포레스트 전용 미니 이모티콘 분할기 by. 릴로</div>
  <div class="site-desc">2260×2620 투명 배경 캔버스를 업로드하면 42개 컷으로 분리 후 제안 사이즈 180×180으로 저장합니다.</div>
  <div class="guide-row">
    <span class="guide-label">이모티콘 한세트 가이드 다운로드</span>
    <button class="guide-btn" id="guide67Btn">⬇ 미니 이모티콘 가이드 (6×7)</button>
  </div>
</div>

<div class="control-bar">
  <label class="upload-zone" id="uploadZone" for="fileInput">
    <div class="uz-icon">🖼</div>
    <div class="uz-text">
      <strong>이미지 업로드</strong>
      <span>PNG · 2260×2620 · 6×7 그리드</span>
    </div>
  </label>
  <input type="file" id="fileInput" accept="image/png,image/webp">
  <button class="btn btn-dark" id="splitBtn" disabled>✂ 분리하기</button>
  <button class="btn btn-light" id="saveSingleBtn" disabled>⬇ 선택 PNG</button>
  <button class="btn btn-orange" id="downloadBtn" disabled>⬇ 전체 ZIP</button>
  <div class="ctrl-divider"></div>
  <span class="bg-label">배경</span>
  <div class="bg-swatches" id="bgSwatches">
    <div class="bg-swatch active" data-bg="transparent"></div>
    <div class="bg-swatch" data-bg="#B6C7D8" style="background:#B6C7D8"></div>
    <div class="bg-swatch" data-bg="#FFE500" style="background:#FFE500"></div>
    <div class="bg-swatch" data-bg="#FFFFFF" style="background:#FFFFFF"></div>
    <div class="bg-swatch" data-bg="#000000" style="background:#000000"></div>
    <div class="bg-swatch" data-bg="#F0F0F0" style="background:#F0F0F0"></div>
  </div>
  <button class="btn-reset" id="resetBtn">↺ 초기화</button>
</div>

<div class="output-area">
  <div class="preview-panel">
    <div class="panel-header">
      <span class="panel-header-title">미리보기</span>
      <span class="panel-header-info" id="previewCounter">#1 / 0</span>
    </div>
    <div class="warn-bar" id="warnBar">⚠ 배경이 투명하지 않습니다. 투명 배경 이미지를 사용해 주세요.</div>
    <div class="preview-body checker" id="previewBody">
      <img id="previewImg" alt="미리보기">
      <div class="preview-placeholder" id="previewPlaceholder">
        <div class="scissors">✂</div>
        <div>이미지를 업로드하고<br><strong>분리하기</strong><br>를 눌러주세요</div>
      </div>
    </div>
  </div>

  <div class="grid-panel">
    <div class="grid-header">
      <span class="grid-header-title">전체 그리드</span>
      <span class="grid-badge" id="gridBadge">0개</span>
      <span class="grid-header-hint">클릭으로 선택 · 360px 원본</span>
    </div>
    <div class="grid-scroll">
      <div class="grid-inner" id="gridInner"></div>
      <div class="empty-hint" id="emptyHint">
        <span style="font-size:32px;opacity:.3">🖼</span>
        이미지를 업로드하고<br>분리하기를 눌러주세요
      </div>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </div>
</div>

document.getElementById('guide67Btn').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = GUIDE_67;
  a.download = '미니_이모티콘_가이드_6x7.png';
  document.body.appendChild(a); a.click(); a.remove();
});

// ── 고정 그리드 상수 ────────────────────────────────────────────────────────
const COLS = 6, ROWS = 7, MARGIN = 50, CUT = 360, OUT = 180;
// 총 42컷, 각 컷: x = MARGIN + c*CUT, y = MARGIN + r*CUT

// ── STATE ────────────────────────────────────────────────────────────────────
let currentBg = 'transparent';
let splitCells = [];
let selectedIdx = -1;
let origImage = null;

const fileInput     = document.getElementById('fileInput');
const uploadZone    = document.getElementById('uploadZone');
const splitBtn      = document.getElementById('splitBtn');
const saveSingleBtn = document.getElementById('saveSingleBtn');
const downloadBtn   = document.getElementById('downloadBtn');
const resetBtn      = document.getElementById('resetBtn');
const previewImg    = document.getElementById('previewImg');
const previewBody   = document.getElementById('previewBody');
const previewPlaceholder = document.getElementById('previewPlaceholder');
const previewCounter= document.getElementById('previewCounter');
const warnBar       = document.getElementById('warnBar');
const gridInner     = document.getElementById('gridInner');
const gridBadge     = document.getElementById('gridBadge');
const emptyHint     = document.getElementById('emptyHint');
const statusBar     = document.getElementById('statusBar');

// ── DRAG & DROP ──────────────────────────────────────────────────────────────
['dragenter','dragover'].forEach(ev => {
  uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
});
['dragleave','dragend'].forEach(ev => {
  uploadZone.addEventListener(ev, () => uploadZone.classList.remove('dragover'));
});
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadImageFile(file);
});

// ── BG SWATCHES ──────────────────────────────────────────────────────────────
document.getElementById('bgSwatches').addEventListener('click', e => {
  const sw = e.target.closest('.bg-swatch');
  if (!sw) return;
  document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active');
  currentBg = sw.dataset.bg;
  applyBg();
  if (splitCells.length > 0) renderGrid();
  if (selectedIdx >= 0) showPreview(selectedIdx);
});

function applyBg() {
  if (currentBg === 'transparent') {
    previewBody.classList.add('checker');
    previewBody.style.background = '';
  } else {
    previewBody.classList.remove('checker');
    previewBody.style.background = currentBg;
  }
}

// ── RESET ────────────────────────────────────────────────────────────────────
resetBtn.addEventListener('click', () => {
  fileInput.value = '';
  origImage = null; splitCells = []; selectedIdx = -1;
  previewImg.style.display = 'none';
  previewPlaceholder.style.display = '';
  previewCounter.textContent = '#1 / 0';
  warnBar.style.display = 'none';
  gridInner.innerHTML = '';
  emptyHint.style.display = '';
  gridBadge.textContent = '0개';
  statusBar.textContent = '';
  splitBtn.disabled = saveSingleBtn.disabled = downloadBtn.disabled = true;
  document.querySelectorAll('.bg-swatch').forEach((s,i) => s.classList.toggle('active', i===0));
  currentBg = 'transparent';
  applyBg();
});

// ── LOAD IMAGE ───────────────────────────────────────────────────────────────
function loadImageFile(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      origImage = img;
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      const corners = [
        cx.getImageData(0,0,1,1).data[3],
        cx.getImageData(img.width-1,0,1,1).data[3],
        cx.getImageData(0,img.height-1,1,1).data[3],
        cx.getImageData(img.width-1,img.height-1,1,1).data[3]
      ];
      warnBar.style.display = corners.some(a => a < 200) ? 'none' : 'block';
      previewImg.src = ev.target.result;
      previewImg.style.display = 'block';
      previewPlaceholder.style.display = 'none';
      previewCounter.textContent = img.width + ' × ' + img.height;
      splitBtn.disabled = false;
      splitCells = []; selectedIdx = -1;
      gridInner.innerHTML = '';
      emptyHint.style.display = '';
      gridBadge.textContent = '0개';
      saveSingleBtn.disabled = downloadBtn.disabled = true;
      statusBar.textContent = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadImageFile(e.target.files[0]); });

// ── SPLIT ─────────────────────────────────────────────────────────────────
splitBtn.addEventListener('click', () => {
  if (!origImage) return;
  statusBar.textContent = '처리 중...';
  setTimeout(() => {
    const sc = document.createElement('canvas');
    sc.width = origImage.width; sc.height = origImage.height;
    const sCtx = sc.getContext('2d');
    sCtx.drawImage(origImage, 0, 0);

    splitCells = [];


    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = MARGIN + c * CUT;
        const y = MARGIN + r * CUT;




        const out = document.createElement('canvas');
        out.width = OUT; out.height = OUT;
        const outCtx = out.getContext('2d');
        outCtx.drawImage(sc, x, y, CUT, CUT, 0, 0, OUT, OUT);
        splitCells.push(out);
      }
    }

    emptyHint.style.display = 'none';
    renderGrid();
    gridBadge.textContent = splitCells.length + '개';
    downloadBtn.disabled = splitCells.length === 0;
    if (splitCells.length > 0) showPreview(0);
    let msg = COLS + '열 × ' + ROWS + '행 | ' + splitCells.length + '개 분리 완료';

    statusBar.textContent = msg;
  }, 30);
});

// ── RENDER GRID ───────────────────────────────────────────────────────────────
function renderGrid() {
  gridInner.innerHTML = '';
  splitCells.forEach((cv, i) => {
    const cell = document.createElement('div');
    cell.className = 'grid-cell';
    if (currentBg === 'transparent') cell.classList.add('checker-cell');
    else cell.style.background = currentBg;
    const img = document.createElement('img');
    img.src = cv.toDataURL('image/png');
    cell.appendChild(img);
    const num = document.createElement('span');
    num.className = 'cell-num'; num.textContent = i + 1;
    cell.appendChild(num);
    cell.addEventListener('click', () => {
      document.querySelectorAll('.grid-cell').forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      showPreview(i);
    });
    gridInner.appendChild(cell);
  });
}

function showPreview(idx) {
  selectedIdx = idx;
  previewImg.src = splitCells[idx].toDataURL('image/png');
  previewImg.style.display = 'block';
  previewPlaceholder.style.display = 'none';
  previewCounter.textContent = '#' + (idx+1) + ' / ' + splitCells.length;
  saveSingleBtn.disabled = false;
}

// ── SAVE SINGLE ───────────────────────────────────────────────────────────────
saveSingleBtn.addEventListener('click', () => {
  if (selectedIdx < 0) return;
  const a = document.createElement('a');
  a.href = splitCells[selectedIdx].toDataURL('image/png');
  a.download = 'mini_emoticon_' + String(selectedIdx+1).padStart(2,'0') + '.png';
  document.body.appendChild(a); a.click(); a.remove();
});

// ── ZIP DOWNLOAD ──────────────────────────────────────────────────────────────
downloadBtn.addEventListener('click', async () => {
  if (!splitCells.length) return;
  downloadBtn.disabled = true;
  downloadBtn.textContent = '생성 중...';
  const zip = new JSZip();
  for (let i = 0; i < splitCells.length; i++) {
    const b64 = splitCells[i].toDataURL('image/png').split(',')[1];
    zip.file('mini_emoticon_' + String(i+1).padStart(2,'0') + '.png', b64, { base64: true });
  }
  const blob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mini_emoticon_cuts.zip';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  downloadBtn.disabled = false;
  downloadBtn.textContent = '⬇ 전체 ZIP';
});
</script>
